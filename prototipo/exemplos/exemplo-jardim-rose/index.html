<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convite · 15 Anos de Mariana Gomes</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f2ea">
<noscript><style>.overlay{display:none!important}</style></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+SC:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<style>
:root{
  --bg:#f7f2ea; --surface:#fff; --ink:#1f1416; --muted:#5f4c4f; --script:#6f1d2e;
  --accent:#6f1d2e; --accent-contrast:#fff; --line:#a8843b; --gold:#b8913f;
  --seal:#6d1a2b; --seal-ink:#ecd393;
  --backdrop:#140b0d; --backdrop-a:rgba(20,11,13,.62); --backdrop-b:rgba(20,11,13,.82);
  --border-valido:rgba(184,145,63,.7); --border-contagem:rgba(184,145,63,.65);
  --env-paper:#fffbf4; --env-shade:#e6d9c3; --env-letter:#fffdf8;
  --texture:url("img/papel.webp");
  --f-script:"Allura","Brush Script MT",cursive;
  --f-caps:"Cormorant SC","Cormorant Garamond",Georgia,serif;
  --f-body:"EB Garamond",Garamond,Georgia,serif;
  --f-button:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border:0 solid}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;scroll-snap-type:y}
body{min-height:100vh;min-height:100svh;color:var(--ink);background:var(--bg);font-family:var(--f-body);line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
img,svg{display:block;vertical-align:middle}
img{max-width:100%;height:auto}
button{font:inherit;color:inherit;background:none;cursor:pointer;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
ol,ul{list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.script{font-family:var(--f-script);font-weight:400;color:var(--script)}
.caps{font-family:var(--f-caps);font-weight:500;font-variant-numeric:lining-nums}
.body{font-family:var(--f-body)}
.ink{color:var(--ink)}
.muted{color:var(--muted)}
.balance{text-wrap:balance}

/* ---------- moldura (telemóvel = ecrã inteiro; computador = cartão) ---------- */
.root{min-height:100vh;min-height:100svh;background-color:var(--bg);background-image:var(--texture);background-repeat:repeat-y;background-size:100% auto}
.card{position:relative}
.screen{position:relative;margin-inline:auto;width:100%;max-width:30rem;container-type:inline-size}
@media (min-width:700px) and (min-height:560px){
  .root{--card-top:2rem;--card-bottom:2rem;padding-top:var(--card-top);background-color:var(--backdrop);background-image:linear-gradient(var(--backdrop-a),var(--backdrop-b)),var(--texture);display:flex;justify-content:center;align-items:flex-start}
  .card{--screen-w:27rem;--screen-h:min(calc(100svh - var(--card-top) - var(--card-bottom)),58rem);width:var(--screen-w);height:var(--screen-h);background-color:var(--bg);contain:layout paint;border-radius:2.25rem;overflow:hidden;box-shadow:0 0 0 1px #ffffff1f,0 40px 80px -30px #000000d9}
  .screen{overscroll-behavior:contain;scroll-snap-type:y;height:100%;overflow-y:auto;background-image:var(--texture);background-repeat:repeat-y;background-size:100% auto;background-attachment:local;scrollbar-width:thin;scrollbar-color:#1f141647 transparent}
}

/* ---------- abertura: envelope ---------- */
html[data-convite-aberto] [data-abertura]{display:none}
.overlay{position:fixed;inset:0;z-index:50;overflow:hidden;background-color:var(--bg);background-image:var(--texture);background-repeat:repeat-y;background-size:100% auto}
.panel{--pq:calc((min(var(--screen-w,100vw),30rem) - 3rem) / 100);position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.75rem;max-width:30rem;height:100%;margin-inline:auto;padding:2rem 1.5rem}
.era{margin-bottom:-1.4rem;font-size:clamp(.9rem,calc(4.2*var(--pq)),1.1rem);letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.panel-nome{font-size:clamp(2.8rem,calc(14*var(--pq)),3.8rem);line-height:1.25;text-align:center}
.envelope{position:relative;width:min(calc(86*var(--pq)),24rem);height:calc(min(calc(86*var(--pq)),24rem) / 1.42);perspective:1200px;padding:0;background:none;border:0}
.envelope:focus-visible{outline:2px solid var(--accent);outline-offset:10px;border-radius:.5rem}
.env-back{position:absolute;inset:0;border-radius:.35rem;background:linear-gradient(180deg,#efe5d6 0%,var(--env-paper) 55%);background:linear-gradient(180deg,color-mix(in srgb,var(--env-shade) 60%,var(--env-paper)) 0%,var(--env-paper) 55%);box-shadow:0 24px 40px -22px rgba(0,0,0,.55)}
.env-letter{position:absolute;inset:5% 5% auto;height:90%;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding-top:7%;border-radius:.2rem;background:var(--env-letter);box-shadow:0 1px 5px rgba(0,0,0,.14)}
.env-letter .mono{font-size:clamp(1.8rem,calc(9*var(--pq)),2.4rem)}
.env-letter .script{font-size:clamp(1.6rem,calc(8*var(--pq)),2.2rem);line-height:1.25}
.env-pocket{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fold{fill:var(--env-paper);stroke:var(--env-shade);stroke-width:1px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.fold-side{fill:#f9f2e6;fill:color-mix(in srgb,var(--env-shade) 22%,var(--env-paper))}
.env-address{position:absolute;inset-inline:8%;bottom:8%;text-align:center;line-height:1.15}
.env-address .para{display:block;font-size:clamp(.7rem,calc(3.4*var(--pq)),.9rem);letter-spacing:.16em;color:var(--muted)}
.env-address .nome{display:block;font-size:clamp(.95rem,calc(4.6*var(--pq)),1.2rem);font-weight:700;letter-spacing:.04em;text-wrap:balance;color:var(--ink);text-transform:uppercase}
.env-flap{position:absolute;inset:0 0 auto;z-index:3;width:100%;height:57%;overflow:visible;transform-origin:50% 0;filter:drop-shadow(0 3px 3px rgba(0,0,0,.16))}
.env-seal{position:absolute;z-index:4;top:57%;left:50%;width:21%;height:0;padding-top:21%;margin:-10.5% 0 0 -10.5%}
.env-seal svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.32))}
.env-seal .mono{position:absolute;inset:0;justify-content:center;align-items:center;color:var(--seal-ink);font-size:clamp(1.25rem,calc(6.6*var(--pq)),1.8rem);letter-spacing:-.02em}
.tap{font-size:clamp(1rem,calc(4.8*var(--pq)),1.25rem);letter-spacing:.12em;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.tap{animation:none}}
.mono span+span{margin-left:-.3em;transform:translateY(.14em)}
.mono{display:inline-flex;align-items:flex-start;font-family:var(--f-caps);font-weight:500;line-height:1;color:var(--accent);user-select:none;font-variant-numeric:lining-nums}

/* ---------- secções ---------- */
.sec{position:relative;display:flex;flex-direction:column;min-height:100vh;min-height:var(--screen-h,100vh);scroll-snap-align:start;overflow:hidden}
.decor{position:absolute;inset:0;overflow:hidden;pointer-events:none;user-select:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 34px,#000 calc(100% - 34px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 34px,#000 calc(100% - 34px),transparent 100%)}
.decor img{position:absolute;height:auto;max-width:none}
.in{position:relative;display:flex;flex:1;width:100%;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;padding-block:5rem;text-align:center}
.px6{padding-inline:1.5rem}
.h2{display:flex;flex-direction:column;align-items:center;text-align:center}
.h2 svg{margin-bottom:.25rem;color:var(--accent)}
.h2 .script{font-size:clamp(3rem,15vw,4.5rem);font-size:clamp(3rem,15cqi,4.5rem);line-height:1.15}
.h2 .caps{position:relative;margin-top:-.6em;font-size:clamp(1.1rem,5.4vw,1.5rem);font-size:clamp(1.1rem,5.4cqi,1.5rem);letter-spacing:.06em;color:var(--ink)}
.lead{max-width:22rem;font-size:clamp(1.2rem,5.6vw,1.4rem);font-size:clamp(1.2rem,5.6cqi,1.4rem);line-height:1.375;font-weight:500;text-wrap:balance}
.nota{max-width:22rem;font-size:clamp(.95rem,4.4vw,1.05rem);font-size:clamp(.95rem,4.4cqi,1.05rem);line-height:1.375;text-wrap:balance;color:var(--muted)}

@supports (height:100svh){.sec{min-height:var(--screen-h,100svh)}}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-contrast);font-family:var(--f-button);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 8px 18px -10px rgb(0 0 0/.55);transition:filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn:active{filter:brightness(.95)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.btn strong{font-weight:700}
.btn-round{width:8rem;height:8rem;flex-direction:column;gap:.375rem;border-radius:9999px;padding:1rem;text-align:center;font-size:.8rem;line-height:1.25}
.btn-pill{min-height:3.5rem;gap:.75rem;border-radius:9999px;padding:.75rem 2rem;font-size:1.05rem}
.btn-row{display:flex;flex-wrap:wrap;justify-content:center;gap:1.5rem}
.link-sub{display:inline-flex;align-items:center;gap:.375rem;font-family:var(--f-caps);font-weight:500;font-size:1rem;color:var(--muted);text-decoration:underline;text-underline-offset:4px}

/* confirmação dentro do convite (plataforma, link pessoal) */
.resp{display:flex;flex-direction:column;align-items:center;gap:.75rem;width:100%;max-width:22rem}
.resp[hidden],.resp [hidden],.btn-row[hidden]{display:none}
.resp .link-sub{min-height:2.75rem}
.opcoes{display:flex;width:100%;max-width:19rem;padding:.25rem;border:1px solid var(--border-valido);border-radius:9999px;background:rgba(255,255,255,.4)}
.opcao{position:relative;display:block;flex:1}
.opcao input{position:absolute;top:50%;left:50%;width:1px;height:1px;opacity:0;pointer-events:none}
.opcao span{display:flex;align-items:center;justify-content:center;min-height:2.75rem;padding:0 .75rem;border-radius:9999px;font-family:var(--f-button);font-size:.85rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);cursor:pointer;transition:background-color .15s,color .15s}
.opcao input:checked+span{background:var(--accent);color:var(--accent-contrast);box-shadow:0 6px 14px -9px rgb(0 0 0/.55)}
.opcao input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.qtd{display:flex;flex-direction:column;align-items:center;gap:.25rem}
.qtd-rot{font-size:clamp(1rem,4.6vw,1.15rem);font-size:clamp(1rem,4.6cqi,1.15rem);letter-spacing:.04em;color:var(--muted)}
.qtd-ctl{display:flex;align-items:center;gap:1.25rem}
.qtd-ctl button{display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;border:1px solid var(--border-valido);border-radius:9999px;color:var(--accent);font-family:var(--f-body);font-size:1.6rem;line-height:1}
.qtd-ctl button:disabled{opacity:.35;cursor:default}
.qtd output{min-width:2ch;font-family:var(--f-body);font-size:clamp(1.8rem,8.5vw,2.2rem);font-size:clamp(1.8rem,8.5cqi,2.2rem);font-weight:500;line-height:1;font-variant-numeric:lining-nums tabular-nums;text-align:center}
.resp textarea{display:block;width:100%;min-height:4.6rem;padding:.6rem .85rem;border:1px solid var(--border-valido);border-radius:.85rem;background:rgba(255,255,255,.6);color:var(--ink);font-family:var(--f-body);font-size:1.05rem;line-height:1.35;resize:vertical}
.resp textarea::placeholder{color:var(--muted)}
.resp textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.resumo{display:flex;flex-direction:column;align-items:center;gap:.3rem;width:100%;border:1px solid var(--border-valido);border-radius:1rem;padding:1rem 1.25rem}
.resumo-rot{font-size:clamp(.85rem,4vw,1rem);font-size:clamp(.85rem,4cqi,1rem);letter-spacing:.16em;color:var(--muted)}
.resumo-val{font-size:clamp(1.2rem,6vw,1.6rem);font-size:clamp(1.2rem,6cqi,1.6rem);font-weight:700;letter-spacing:.04em;color:var(--ink)}
.resp-estado:empty{display:none}
#resp-enviar{margin-top:.5rem}
.btn-pill[data-avisar]{padding-inline:1.5rem;font-size:.95rem;line-height:1.35}
.btn-pill[data-avisar] span{text-wrap:balance}
.btn:disabled{opacity:.6;cursor:default}

/* convite */
.mono-xl{font-size:clamp(4.5rem,22vw,6rem);font-size:clamp(4.5rem,22cqi,6rem)}
.bencao{font-size:clamp(1.1rem,5.2vw,1.4rem);font-size:clamp(1.1rem,5.2cqi,1.4rem);letter-spacing:.05em}
.pais{display:grid;grid-template-columns:1fr 1fr;column-gap:1.25rem;width:100%;font-family:var(--f-caps);font-weight:500;font-size:clamp(.9rem,4.2vw,1.15rem);font-size:clamp(.9rem,4.2cqi,1.15rem);line-height:1.375;letter-spacing:.02em}
.pais p:first-child{text-align:right}
.pais p:last-child{text-align:left}
.pais span{display:block}
.pais.um{grid-template-columns:1fr}
.pais.um p{text-align:center!important}
.honra{font-size:clamp(1.05rem,5vw,1.3rem);font-size:clamp(1.05rem,5cqi,1.3rem);letter-spacing:.05em}
.convidado{width:100%}
.convidado p{padding-inline:1rem;text-align:center;font-family:var(--f-caps);font-size:clamp(1.3rem,6.6vw,2rem);font-size:clamp(1.3rem,6.6cqi,2rem);line-height:1.25;font-weight:700;letter-spacing:.04em;text-wrap:balance;color:var(--ink);text-transform:uppercase}
.pontilhado{margin-top:.25rem;display:flex;align-items:center}
.pontilhado .o{width:.75rem;height:.75rem;flex-shrink:0;border-radius:9999px;border:2px solid var(--gold)}
.pontilhado .l{height:0;flex:1;border-top:3px dotted var(--gold)}
.motivo{font-size:clamp(.95rem,4.4vw,1.15rem);font-size:clamp(.95rem,4.4cqi,1.15rem);letter-spacing:.04em;text-wrap:balance}
.nome-grande{font-size:clamp(2.6rem,13vw,3.8rem);font-size:clamp(2.6rem,13cqi,3.8rem);line-height:1.25;text-wrap:balance}
.data{text-align:center;color:var(--ink)}
.data time{font-family:var(--f-body);font-size:clamp(1.45rem,7.3vw,2.4rem);font-size:clamp(1.45rem,7.3cqi,2.4rem);line-height:1;font-weight:500;letter-spacing:.02em;text-transform:uppercase;font-variant-numeric:lining-nums;white-space:nowrap}
.data time i{display:inline-block;width:.5rem;height:.5rem;margin-inline:.5rem;border-radius:9999px;background:var(--gold);vertical-align:middle}
.data .dia{margin-top:.5rem;font-size:clamp(1rem,4.6vw,1.3rem);font-size:clamp(1rem,4.6cqi,1.3rem);letter-spacing:.05em;text-transform:uppercase}
.tema{display:flex;flex-direction:column;align-items:center;gap:.1rem}
.tema .caps{font-size:clamp(.85rem,4vw,1rem);font-size:clamp(.85rem,4cqi,1rem);letter-spacing:.18em;color:var(--muted)}
.tema .script{font-size:clamp(2.1rem,10.5vw,2.8rem);font-size:clamp(2.1rem,10.5cqi,2.8rem);line-height:1.15}
.valido{margin-inline:auto;width:100%;max-width:24rem;border-radius:1rem;border:1px solid var(--border-valido);padding:1rem 1.25rem;text-align:center;font-size:clamp(1rem,4.8vw,1.2rem);font-size:clamp(1rem,4.8cqi,1.2rem);letter-spacing:.04em;color:var(--ink)}
.heroimg{position:relative;display:block;width:100%;height:auto}

/* galeria */
.gal-head{display:flex;flex-direction:column;align-items:center;gap:.75rem;padding-inline:1.5rem}
.gal-sub{max-width:16rem;font-size:clamp(1.1rem,5.2vw,1.35rem);font-size:clamp(1.1rem,5.2cqi,1.35rem);letter-spacing:.05em;text-wrap:balance}
.gal{width:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;padding-block:1.25rem 1.75rem;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.gal::-webkit-scrollbar{display:none}
.gal-track{display:flex}
.gal-track::before,.gal-track::after{content:"";flex:0 0 19%}
.gal-slide{flex:0 0 62%;min-width:0;position:relative;scroll-snap-align:center}
.gal-frame{display:block;width:100%;padding:.45rem;background:#fff;border:0;transform-origin:50% 50%;box-shadow:0 18px 30px -18px rgba(0,0,0,.6);will-change:transform}
.gal-frame:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.gal-photo{position:relative;display:block;height:0;padding-top:125%;overflow:hidden;background:#faf3f2}
.gal-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* mensagem */
.msg-mono{position:relative;z-index:10;font-size:clamp(3.6rem,17vw,4.6rem);font-size:clamp(3.6rem,17cqi,4.6rem)}
.msg-img{display:block;width:100%;height:auto;margin-top:-16vw;margin-top:-16cqi}
.msg-q{position:relative;margin-top:-12vw;margin-top:-12cqi;padding-inline:2rem;font-family:var(--f-body);font-style:italic;font-size:clamp(1.2rem,5.6vw,1.45rem);font-size:clamp(1.2rem,5.6cqi,1.45rem);line-height:1.375;text-wrap:balance;white-space:pre-line;color:var(--ink)}

/* cronograma */
.evento{display:flex;width:100%;flex-direction:column;align-items:center;gap:1rem}
.evento h3{font-family:var(--f-caps);font-size:clamp(1.2rem,5.8vw,1.5rem);font-size:clamp(1.2rem,5.8cqi,1.5rem);font-weight:700;letter-spacing:.05em;color:var(--accent)}
.evento p{max-width:22rem;font-family:var(--f-caps);font-weight:500;font-size:clamp(.95rem,4.4vw,1.2rem);font-size:clamp(.95rem,4.4cqi,1.2rem);letter-spacing:.04em;text-wrap:balance}
.evento p strong{font-weight:700}
.tl{--row-h:9.5rem;--dot-y:calc(var(--row-h)*.43);--dot:.9rem;position:relative;margin-top:1rem;width:100%;color:var(--line);container-type:inline-size}
.tl-line{position:absolute;inset:0 0 auto;width:100%;overflow:visible}
.tl-wide{height:calc(var(--rows-wide)*var(--row-h))}
.tl-narrow{height:calc(var(--rows-narrow)*var(--row-h));display:none}
.tl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:var(--row-h);position:relative}
.tl-item{position:relative;grid-row:var(--row-wide);grid-column:var(--col-wide)}
.tl-ico{position:absolute;top:calc(var(--dot-y) - var(--dot)/2 - 3.6rem);left:50%;transform:translateX(-50%);width:3.2rem;height:3.2rem;color:var(--accent)}
.tl-dot{position:absolute;top:calc(var(--dot-y) - var(--dot)/2);left:50%;transform:translateX(-50%);width:var(--dot);height:var(--dot);border-radius:9999px;background:var(--accent)}
.tl-label{position:absolute;top:calc(var(--dot-y) + var(--dot)/2 + .8rem);inset-inline:9%;margin:0;color:var(--ink);font-family:var(--f-body);font-size:1rem;font-weight:500;line-height:1.2;text-align:center;font-variant-numeric:lining-nums}
.tl-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.tl-time{display:block}
@container (max-width:339px){
  .tl-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tl-item{grid-row:var(--row-narrow);grid-column:var(--col-narrow)}
  .tl-label{inset-inline:12%}
  .tl-wide{display:none}
  .tl-narrow{display:block}
}

/* contagem */
.cd{display:grid;width:100%;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
.cd div{display:flex;flex-direction:column-reverse;align-items:center;border-radius:1rem;border:1px solid var(--border-contagem);padding:.75rem .25rem}
.cd dt{font-family:var(--f-caps);font-weight:500;font-size:clamp(.8rem,3.8vw,1rem);font-size:clamp(.8rem,3.8cqi,1rem);letter-spacing:.05em;color:var(--muted)}
.cd dd{font-family:var(--f-body);font-size:clamp(2rem,10vw,2.8rem);font-size:clamp(2rem,10cqi,2.8rem);line-height:1;font-weight:500;font-variant-numeric:lining-nums tabular-nums}
.cd-p{margin-top:1rem;font-size:clamp(1rem,4.8vw,1.25rem);font-size:clamp(1rem,4.8cqi,1.25rem);letter-spacing:.05em}

/* manual */

        var noRow = Math.min(cols, n - r * cols), ltr = r % 2 === 0;

    tocar();
    var reduzir = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var selo = $("#selo"), aba = $("#aba"), carta = $("#carta");
    var p = Promise.resolve();
    if (!reduzir) {
      p = p.then(function () { return anim(selo, { transform: ["scale(1)", "scale(1.12)", "scale(0)"], opacity: [1, 1, 0] }, { duration: 500, easing: "ease-in" }); })
        .then(function () { return anim(aba, { transform: ["rotateX(0deg)", "rotateX(180deg)"] }, { duration: 600, easing: "cubic-bezier(.45,0,.2,1)" }); })
        .then(function () { aba.style.zIndex = "-1"; return anim(carta, { transform: ["translateY(0%)", "translateY(-40%)"] }, { duration: 650, easing: "ease-out" }); });
    }
    p.then(function () { return anim(overlay, { opacity: [1, 0] }, { duration: reduzir ? 250 : 550 }); })
      .catch(function () {})
      .then(function () {
        estado = "aberto";
        overlay.remove();
        desbloquear();
        root.setAttribute("data-convite-aberto", "");
        var h1 = $("#convite-titulo"); if (h1.focus) h1.focus({ preventScroll: true });
        centrar(1);
      });
  }
  var env = $("#envelope");
  if (env) env.addEventListener("click", abrir);

  /* ---------- ordem das secções (config.seccoes): aplicada no fim, depois de tudo desenhado ---------- */
  if (C.seccoes && C.seccoes.length) {
    var mainEl = $("#convite"), porId = {};
    $$("main > section[data-seccao]").forEach(function (s) { porId[s.getAttribute("data-seccao")] = s; });
    Object.keys(porId).forEach(function (k) { if (C.seccoes.indexOf(k) < 0) porId[k].remove(); });
    C.seccoes.forEach(function (k) { if (porId[k]) mainEl.appendChild(porId[k]); });
  }

  /* ---------- arranque ---------- */
  window.addEventListener("hashchange", personalizar);
  requestAnimationFrame(function () { centrar(Math.min(1, fotos.length - 1)); });
  window.addEventListener("load", function () { centrar(Math.min(1, fotos.length - 1)); });
})();
</script>
</body>
</html>
